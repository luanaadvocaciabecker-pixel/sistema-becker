name: Robô DataJud

# Atualiza as movimentações dos processos consultando a API Pública do DataJud (CNJ).
# Roda 1x por dia (06:00 horário de Brasília = 09:00 UTC) e também sob demanda.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar robô DataJud
        run: node robo-datajud/atualiza_datajud.mjs
        env:
          SUPABASE_URL: https://fnuzhypsqvyolqqafrba.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATAJUD_APIKEY: ${{ secrets.DATAJUD_APIKEY }}
