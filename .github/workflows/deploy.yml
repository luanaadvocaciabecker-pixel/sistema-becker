name: Deploy Cloudflare Pages

# Publica o site automaticamente no Cloudflare Pages a cada push na main.
# Também pode ser disparado manualmente (aba Actions -> Run workflow).
#
# Requer 2 secrets no repositório (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   -> token com permissão "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  -> ID da conta Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'pages-deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Estampa a versão publicada: troca o __BUILD__ do index.html e grava version.txt.
      # A página compara os dois quando volta o foco e avisa que há atualização — sem isso,
      # a aba fica aberta no celular por horas com o JS antigo e a correção parece não ter
      # subido.
      - name: Estampar a versão
        run: |
          BUILD="$(git rev-parse --short HEAD)-$(date -u +%d%m%H%M)"
          echo "Build: $BUILD"
          sed -i "s/__BUILD__/$BUILD/g" pages-deploy/index.html
          printf '%s' "$BUILD" > pages-deploy/version.txt
          grep -c "$BUILD" pages-deploy/index.html

      - name: Deploy para o Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0ee385df43ca39dd0102c7041580b5ed
          command: pages deploy pages-deploy --project-name=advocacia-becker --branch=main
